# Railway config-as-code for the agent service.
# Set this service's Root Directory to `agent` in the Railway dashboard.
# Volumes cannot be declared here: attach one at /data in the dashboard and set
# NORTHSTAR_DB_PATH=/data/northstar.db (see README.md).
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# GET /crm returns the CRM snapshot; it is the closest thing the agent has to a health endpoint.
healthcheckPath = "/crm"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
