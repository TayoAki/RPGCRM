# Railway config-as-code for the UI service.
# Set this service's Root Directory to `frontend` in the Railway dashboard and
# give it a public domain. Set AGENT_URL to the agent's private address.
[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
